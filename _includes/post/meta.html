<p class="d-flex">
    <span>
        <i class="fa-solid fa-calendar-days me-1"></i> {%- include post/day.html date:post.date -%}
    </span>

<span class="mx-1">•</span>

{%- assign author = site.authors[post.data.author] -%}
{%- if author -%}
    {%- if author.github -%}
    <img class="rounded-circle me-2" alt="author" height="28" width="28" src="https://avatars.githubusercontent.com/{{ author.github }}?size=60">
    {%- endif -%}
    {{ author.name }}
{%- else -%}
Unknown author
{%- endif -%}
</p>
