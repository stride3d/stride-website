# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build Stride Web for Azure Web App Release 🚀

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write  # required to sign in to Azure (purge of the Azure Front Door cache)

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stride-website'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0EC7AAA18A5048079220FA310DB3CB04 }}
          package: .

      # Azure Front Door caches www.stride3d.net: without a purge, it serves the old images, search.json and sitemap.xml until they expire
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          # Variables of the Production environment: the stride-frontdoor-purge managed identity
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Purge the Azure Front Door cache
        # Front Door takes a few minutes to apply it, no need to wait
        run: az afd endpoint purge -g Stride3d --profile-name stride-frontdoor --endpoint-name stride-website --content-paths '/*' --no-wait
